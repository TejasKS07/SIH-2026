[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goclick"
version = "0.0.1"
description = "GoClick: Fast Lightweight GUI Element Grounding Model and Privacy Vision Agent"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "sentencepiece>=0.1.99", "shortuuid",
    "pydantic", "markdown2[all]", "scikit-learn>=1.2.2",
    "gradio>=4.16.0", "gradio_client>=0.8.1",
    "requests", "httpx>=0.24.0", "uvicorn", "fastapi",
    "einops>=0.6.1", "einops-exts>=0.0.4", "spacy", "lxml", "openai", "scikit-image", "peft", "qwen-vl-utils"
]

[project.optional-dependencies]
train = ["ninja", "wandb"]
build = ["build", "twine"]

[project.urls]
"Homepage" = "https://github.com/ZJULiHongxin/GoClick"
"Bug Tracker" = "https://github.com/ZJULiHongxin/GoClick/issues"

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]
