<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vision Chat & Privacy Assistant</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-title">
        <span class="logo" role="img" aria-label="Target">🎯</span>
        <h2>Vision Chat</h2>
      </div>
      <div class="header-actions">
        <div id="statusBadge" class="status-badge checking" title="VLM Backend connection status">
          <span class="dot"></span>
          <span id="statusText">Checking...</span>
        </div>
        <button id="popoutBtn" class="header-icon-btn" title="Open in standalone window" aria-label="Pop out window">
          ⤢
        </button>
      </div>
    </header>

    <main id="chat" aria-live="polite" aria-label="Chat history">
      <div class="message assistant welcome">
        <strong>👋 Welcome to Vision Chat!</strong><br>
        Capture a screenshot and ask questions to locate UI elements or scan for sensitive PII regions.
      </div>
    </main>

    <div id="previewContainer" aria-label="Screenshot preview">
      <div class="preview-header">
        <span>Active Screenshot</span>
        <button id="clearPreview" class="icon-btn" title="Remove screenshot" aria-label="Remove screenshot">✕</button>
      </div>
      <div class="canvas-wrapper">
        <img id="previewImage" alt="Screenshot preview">
        <canvas id="overlayCanvas"></canvas>
      </div>
    </div>

    <footer id="inputArea">
      <div class="quick-actions">
        <button id="captureBtn" class="action-btn" aria-label="Capture page screenshot">📸 Capture</button>
        <button id="detectPiiBtn" class="action-btn secondary" aria-label="Scan page for PII">🔒 Scan PII</button>
      </div>

      <div class="input-wrapper">
        <textarea
          id="prompt"
          placeholder="e.g., 'Click on the search bar' or 'Where is the submit button?'"
          rows="2"
          aria-label="Input prompt"
        ></textarea>
        <button id="sendBtn" class="send-btn" title="Send query" aria-label="Send query">➤</button>
      </div>
    </footer>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
